<title>Money Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
@font-face{font-family:"Open Sauce Sans";src:url("fonts/OpenSauceSans-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Open Sauce Sans";src:url("fonts/OpenSauceSans-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Open Sauce Sans";src:url("fonts/OpenSauceSans-700.woff2") format("woff2");font-weight:700;font-display:swap}

/* Layout: a Habit Builder sheet for money. Header = menu + month picker + type slider; footer = quick actions (Simpan, Tambah, Load);
   tablet = 6+6; desktop = 12-column grid, max 1280px, every row of sections starting on one 2px rule. Single light theme by brand rule. */
:root{
  /* colour (unchanged) */
  --paper:#f5f3ef; --panel:#efefef; --track:#d9d9d9; --ink:#000000; --on-ink:#ffffff; --accent:#43934d;
  --raised:#ffffff; --n200:#e8e5df; --n300:#d6d2ca; --n400:#b5b0a6; --n500:#8c877e; --n600:#6b665e; --n800:#2e2b28;
  --danger:#c8372a; --danger-bg:#f7d1ca; --danger-text:#a22116;
  --success-bg:#eef7ea; --success-text:#35714e;
  --warning:#e0a526; --warning-bg:#fbe6a8; --warning-text:#7a5200;
  --focus:#2f6690; --info-bg:#dde8f0; --info-text:#1f4766; --green-100:#d9ecc0; --blue-200:#c9d9e6;
  --scrim:rgba(0,0,0,.42); --on-fill:#000000;
  /* category identity colours (icon + tint), one set per theme */
  --cat-1:#3a6ea5; --cat-2:#2e8a83; --cat-3:#4f8a3c; --cat-4:#a8761a; --cat-5:#c0602b; --cat-6:#b8473f; --cat-7:#7a55a8; --cat-8:#5f6b7a;

  /* type: one source. Sans for words, Plex Mono for money, percentages, table dates and the amount input */
  --sans:"Open Sauce Sans","Open Sauce One",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-display:600 32px/36px var(--mono);
  --f-title:700 20px/26px var(--sans);
  --f-stat:600 18px/24px var(--mono);
  --f-section:700 12px/16px var(--sans);
  --f-body:400 14px/20px var(--sans);
  --f-body-strong:700 14px/20px var(--sans);
  --f-amount:500 14px/20px var(--mono);
  --f-amount-s:500 11px/14px var(--mono);
  --f-meta:400 12px/16px var(--sans);
  --f-micro:700 11px/14px var(--sans);
  --f-input:600 28px/34px var(--mono);
  --f-control:400 16px/20px var(--sans);
  --f-button:700 14px/20px var(--sans);
  --tr-section:.08em; --tr-micro:.06em;

  /* spacing: 4px base */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --gutter:16px; --gap-section:24px; --gap-col:16px; --row-min:44px; --row-pad:10px;
  --header-h:52px; --tabbar-h:56px;
  --day:35px; --band:28px; --cb:16px;

  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:999px;
  --rule-top:2px solid var(--ink); --hair:1px solid var(--ink); --dash:1px dashed var(--ink);

  /* motion tokens (unchanged) */
  --t-instant:100ms; --t-fast:160ms; --t-base:220ms; --t-slow:320ms;
  --e-enter:cubic-bezier(.2,0,0,1); --e-move:cubic-bezier(.4,0,.2,1); --e-exit:cubic-bezier(.4,0,1,1);
  --e-out:cubic-bezier(.22,1,.36,1); --e-in:cubic-bezier(.5,0,.75,0);
  color-scheme:light;
}
/* dark mode: neutral near-black paper, same ink roles inverted; follows the device unless the header toggle picked one */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-mode="light"]){ --paper:#0d0d0d; --panel:#171717; --track:#333333; --ink:#f2f2f2; --on-ink:#0d0d0d; --accent:#5aae66; --raised:#1b1b1b; --n200:#242424; --n300:#343434; --n400:#575757; --n500:#8a8a8a; --n600:#a8a8a8; --n800:#d6d6d6; --danger:#e0675a; --danger-bg:#3a1e1a; --danger-text:#f3a79d; --success-bg:#182a1c; --success-text:#8ed29a; --warning:#e6b44a; --warning-bg:#3a2f13; --warning-text:#f1cf7f; --focus:#86b6de; --info-bg:#172638; --info-text:#a8c9e8; --green-100:#203a24; --blue-200:#1f3550; --scrim:rgba(0,0,0,.6); --on-fill:#0d0d0d; --cat-1:#7fb0e0; --cat-2:#6cc7bf; --cat-3:#8ccf74; --cat-4:#e3b55a; --cat-5:#ec9a66; --cat-6:#ec8a82; --cat-7:#b79ae0; --cat-8:#a3afbe; color-scheme:dark; } }
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{ --paper:#0d0d0d; --panel:#171717; --track:#333333; --ink:#f2f2f2; --on-ink:#0d0d0d; --accent:#5aae66; --raised:#1b1b1b; --n200:#242424; --n300:#343434; --n400:#575757; --n500:#8a8a8a; --n600:#a8a8a8; --n800:#d6d6d6; --danger:#e0675a; --danger-bg:#3a1e1a; --danger-text:#f3a79d; --success-bg:#182a1c; --success-text:#8ed29a; --warning:#e6b44a; --warning-bg:#3a2f13; --warning-text:#f1cf7f; --focus:#86b6de; --info-bg:#172638; --info-text:#a8c9e8; --green-100:#203a24; --blue-200:#1f3550; --scrim:rgba(0,0,0,.6); --on-fill:#0d0d0d; --cat-1:#7fb0e0; --cat-2:#6cc7bf; --cat-3:#8ccf74; --cat-4:#e3b55a; --cat-5:#ec9a66; --cat-6:#ec8a82; --cat-7:#b79ae0; --cat-8:#a3afbe; color-scheme:dark; }
@media (min-width:640px){ :root{ --gutter:24px; --gap-col:24px } }
@media (min-width:1024px){
  :root{
    --f-display:600 44px/48px var(--mono); --f-title:700 24px/30px var(--sans); --f-stat:600 22px/28px var(--mono);
    --f-section:700 13px/18px var(--sans); --f-body:400 15px/22px var(--sans); --f-body-strong:700 15px/22px var(--sans);
    --gutter:32px; --gap-section:32px; --gap-col:24px; --row-min:40px; --row-pad:8px;
  }
}
html{background:var(--paper);overflow-y:scroll;scrollbar-gutter:stable}
body{background:var(--paper);color:var(--ink);font:var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--paper)}
*{box-sizing:border-box}
button,input,select{color:inherit}
button{font:var(--f-button);-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
table{border-collapse:collapse}
p{margin:0}

/* type roles */
.t-display,.big{font:var(--f-display);font-variant-numeric:tabular-nums}
.month-display,.year,.t-title{font:var(--f-title);text-transform:uppercase;letter-spacing:.04em;margin:0}
.product{font:var(--f-section);letter-spacing:var(--tr-section);text-transform:uppercase;margin:0}
.stat{font:var(--f-stat);font-variant-numeric:tabular-nums;margin:0}
.sec-title{font:var(--f-section);letter-spacing:var(--tr-section);text-transform:uppercase;margin:0}
.eyebrow{font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase;color:var(--n600);margin:0}
.label{font:var(--f-body-strong)}
.meta,.cell{font:var(--f-meta);color:var(--n600)}
.num,.amt,.micro{font:var(--f-amount);font-variant-numeric:tabular-nums}
.cnt{font:inherit;font-variant-numeric:tabular-nums}
.micro{font:var(--f-amount)}
.muted{color:var(--n600)}
.r{text-align:right}.c{text-align:center}
.help{font:var(--f-meta);color:var(--n600);max-width:60ch}

/* page frame: room at the bottom for the quick-action bar on every size */
.app{max-width:calc(1280px + 2 * var(--gutter));margin:0 auto;padding-block:0 calc(var(--tabbar-h) + var(--sp-7) + env(safe-area-inset-bottom,0px));padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* header: menu + month picker on the left; type slider below (phone) or on the right (desktop) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;flex-direction:column;gap:var(--sp-2);border-bottom:var(--hair);margin:0 calc(-1 * var(--gutter));padding:var(--sp-1) var(--gutter) var(--sp-2)}
.hrow{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--header-h);min-width:0}
.navbtn{width:44px;height:44px;border:var(--hair);border-radius:var(--r-md);background:transparent;cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none;transition:background var(--t-fast),color var(--t-fast)}
.navbtn:hover{background:var(--ink);color:var(--on-ink)}
.navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.monthbtn{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:44px;padding:0 var(--sp-3);border:0;border-radius:var(--r-md);background:transparent;cursor:pointer;min-width:0;transition:background var(--t-fast)}
.monthbtn:hover,.monthbtn[aria-expanded="true"]{background:var(--n200)}
.monthbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;flex:none;transition:transform var(--t-fast) var(--e-move)}
.monthbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.monthtxt{display:inline-flex;gap:var(--sp-2);align-items:baseline;overflow:hidden;white-space:nowrap}
.saveerr{font:var(--f-micro);color:var(--danger-text);margin-left:auto;white-space:nowrap;flex:none}
/* narrow phones: the message shrinks to a dot so the month title keeps its room; the text stays as its label */
@media (max-width:420px){.saveerr:not(:empty){font-size:0;width:8px;height:8px;border-radius:var(--r-full);background:var(--danger)}}
.hprefs{display:flex;gap:var(--sp-1);flex:none}
.iconbtn.pref{width:44px;height:44px;border:var(--hair);color:var(--ink)}
@media (min-width:1024px){.iconbtn.pref{width:40px;height:40px}}
.pref svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pref.lang span{font:var(--f-amount);font-weight:600}
.pref[aria-pressed="true"]{background:var(--n200)}
@media (max-width:420px){.month-display,.year{letter-spacing:.02em}.monthbtn{padding:0 var(--sp-2)}.hrow{gap:var(--sp-1)}}
.monthtxt{text-overflow:ellipsis}
@media (min-width:1024px){
  .top{position:static;flex-direction:row;align-items:center;justify-content:space-between;margin:0;padding:var(--sp-5) 0 var(--sp-4);gap:var(--sp-5)}
  .top .seg{max-width:620px}
}
.app.is-onb .top{display:none}

/* segmented slider: one thumb slides under the chosen type */
.seg{position:relative;display:flex;gap:2px;background:var(--n200);border-radius:var(--r-full);padding:3px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg{touch-action:pan-x;cursor:grab;user-select:none;-webkit-user-select:none;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.seg.dragging{cursor:grabbing;scroll-snap-type:none}
.seg.dragging button{pointer-events:none}
.seg button{scroll-snap-align:center}
/* fade the edge that still has hidden options, so it reads as slidable */
.seg::before,.seg::after{content:"";position:sticky;z-index:2;flex:0 0 32px;align-self:stretch;margin:-3px 0;pointer-events:none;opacity:0;transition:opacity var(--t-fast)}
.seg::before{left:-3px;margin-right:-34px;background:linear-gradient(to right,var(--n200) 25%,transparent)}
.seg::after{right:-3px;margin-left:-34px;background:linear-gradient(to left,var(--n200) 25%,transparent)}
.seg.more-l::before,.seg.more-r::after{opacity:1}
.seg button{position:relative;z-index:1;flex:1 0 auto;border:0;background:none;height:38px;padding:0 var(--sp-3);border-radius:var(--r-full);font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase;color:var(--n600);cursor:pointer;white-space:nowrap;transition:color var(--t-fast)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--on-ink)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:var(--r-full);background:var(--ink);transition:transform var(--t-base) var(--e-move),width var(--t-base) var(--e-move)}
@media (min-width:1024px){.seg button{height:32px}}

/* quick-action bar: full width on phone/tablet, a floating dock on desktop */
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:var(--hair);display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:center;gap:var(--sp-2);padding:var(--sp-2) max(var(--gutter),env(safe-area-inset-right,0px)) calc(var(--sp-2) + env(safe-area-inset-bottom,0px)) max(var(--gutter),env(safe-area-inset-left,0px))}
.fbar button{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:44px;padding:0 var(--sp-3);border:var(--hair);border-radius:var(--r-full);background:transparent;cursor:pointer;font:var(--f-button);transition:background var(--t-fast),transform var(--t-instant)}
.fbar button:hover{background:var(--n200)}
.fbar button:active{transform:scale(.97)}
.fbar button{width:104px;height:44px;min-height:0;padding:0}
.fbar .add{width:132px;height:48px;background:var(--ink);color:var(--on-ink)}
.fbar .add:hover{background:var(--n800)}
/* Simpan = keeping data safe (green), Load = bringing data in (blue); each with its own darker text and border */
.fbar [data-act=save]{background:var(--success-bg);color:var(--success-text);border-color:var(--success-text)}
.fbar [data-act=save]:hover{background:var(--green-100)}
.fbar [data-act=load]{background:var(--info-bg);color:var(--info-text);border-color:var(--info-text)}
.fbar [data-act=load]:hover{background:var(--blue-200)}
.fbar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.fbar .kbd{font:var(--f-amount-s);border:1px solid currentColor;border-radius:4px;padding:0 var(--sp-1);opacity:.7}
@media (max-width:1023px){.fbar .kbd{display:none}}
@media (min-width:1024px){
  .fbar{left:50%;right:auto;bottom:var(--sp-5);transform:translateX(-50%);border:var(--hair);border-radius:var(--r-full);padding:var(--sp-2);grid-template-columns:auto auto auto}
}
.app.is-onb ~ .fbar{display:none}

/* banner + controls */
.banner{margin-top:var(--sp-3);padding:var(--sp-2) var(--sp-3);display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center;justify-content:space-between;background:var(--warning-bg);border-radius:var(--r-md)}
.banner p{font:var(--f-meta);color:var(--ink)}
.btn{min-height:44px;padding:0 var(--sp-4);border:var(--hair);border-radius:var(--r-md);background:transparent;cursor:pointer;font:var(--f-button);transition:background var(--t-fast),color var(--t-fast),transform var(--t-instant)}
.btn:hover{background:var(--n200)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:var(--n800)}
.btn.danger{color:var(--danger-text);border-color:var(--danger-text)}
.btn.small{min-height:36px;padding:0 var(--sp-3)}
.btn.wide{width:100%;min-height:48px}
.btn:disabled{background:var(--n200);border-color:var(--n200);color:var(--n500);cursor:not-allowed;transform:none}
@media (max-width:1023px){.btn.small{min-height:44px}}
.linkbtn{background:none;border:0;padding:var(--sp-1) 0;min-height:32px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:var(--f-button)}
.iconbtn{border:0;border-radius:var(--r-md);background:transparent;cursor:pointer;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--n600);transition:color var(--t-fast),background var(--t-fast)}
@media (max-width:1023px){.iconbtn{width:44px;height:44px}}
.iconbtn:hover{color:var(--ink);background:var(--n200)}
.iconbtn.del:hover{color:var(--danger-text)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none}
.iconbtn:disabled{opacity:.3;cursor:not-allowed;background:none}

/* view + motion */
.view{margin-top:var(--gap-section);display:flex;flex-direction:column;gap:var(--gap-section)}
.view.enter{animation:viewIn var(--t-base) var(--e-move) both}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,8px))}to{opacity:1;transform:none}}
.monthtxt.flip>*{animation:flipIn var(--t-base) var(--e-enter) both}
@keyframes flipIn{from{opacity:0;transform:translateY(var(--dy,-14px))}to{opacity:1;transform:none}}
.view.boot .block{animation:fadeUp var(--t-slow) var(--e-enter) both}
.view.boot .block:nth-child(2){animation-delay:30ms}.view.boot .block:nth-child(3){animation-delay:60ms}
.view.boot .block:nth-child(4){animation-delay:90ms}.view.boot .block:nth-child(5){animation-delay:120ms}.view.boot .block:nth-child(n+6){animation-delay:150ms}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* sections: a 2px rule, the title, 12px, the content */
.block{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.sec{border-top:var(--rule-top);padding-top:var(--sp-3);display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);min-width:0}
.sec .amt{font:var(--f-amount);white-space:nowrap}
.sec .side{font:var(--f-meta);color:var(--n600)}
details.fold{display:flex;flex-direction:column}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .sec{position:relative;padding-right:var(--sp-6);min-height:var(--row-min)}
details.fold>summary .sec::after{content:"";position:absolute;right:var(--sp-2);top:calc(var(--sp-3) + 3px);width:8px;height:8px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);transition:transform var(--t-fast) var(--e-move)}
details.fold[open]>summary .sec::after{transform:translateY(4px) rotate(-135deg)}
details.fold[open]>summary{margin-bottom:var(--sp-3)}
@media (min-width:1024px){details.fold>summary{pointer-events:none}details.fold>summary .sec::after{display:none}details.fold>summary .sec{padding-right:0;min-height:0}}

/* grids */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap-section) var(--gap-col);align-items:stretch}
.grid>*{grid-column:1/-1}
@media (min-width:1024px){.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s3{grid-column:span 3}}
.formcol{max-width:640px;display:flex;flex-direction:column;gap:var(--gap-section)}

/* dashboard areas: phone = one column in DOM order (period last); tablet 6+6; desktop 12 columns */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap-section) var(--gap-col);align-items:stretch}
.dash .a-ring,.dash .a-today{display:none}
.dash .a-period{order:99}
@media (min-width:640px){
  .dash{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"period period" "left ring" "today goals" "status progress" "daily daily" "cash top" "debt debt" "needs wants" "savings income"}
  .dash .a-ring,.dash .a-today{display:flex}
  .dash .a-period{order:0}
  .pg-used{display:none}
}
@media (min-width:1024px){
  .dash{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-areas:
    "period period period period period period period period period period period period"
    "left left left left left left ring ring ring ring ring ring"
    "today today today today today today goals goals goals goals goals goals"
    "status status status status status status status status progress progress progress progress"
    "daily daily daily daily daily daily daily daily daily daily daily daily"
    "cash cash cash cash cash cash cash cash debt debt debt debt"
    "top top top top top top top top top top top top"
    "needs needs needs needs needs needs wants wants wants wants wants wants"
    "savings savings savings savings savings savings income income income income income income"}
}
@media (min-width:1280px){
  .dash{grid-template-areas:
    "period period period period period period period period period period period period"
    "left left left ring ring ring today today today goals goals goals"
    "status status status status status status status status progress progress progress progress"
    "daily daily daily daily daily daily daily daily daily daily daily daily"
    "cash cash cash cash top top top top debt debt debt debt"
    "needs needs needs wants wants wants savings savings savings income income income"}
}
.a-period{grid-area:period}.a-left{grid-area:left}.a-ring{grid-area:ring}.a-today{grid-area:today}.a-goals{grid-area:goals}
.a-status{grid-area:status}.a-progress{grid-area:progress}.a-daily{grid-area:daily}.a-cash{grid-area:cash}.a-top{grid-area:top}
.a-debt{grid-area:debt}.a-needs{grid-area:needs}.a-wants{grid-area:wants}.a-savings{grid-area:savings}.a-income{grid-area:income}
@media (max-width:639px){.dash>*{grid-area:auto}}

/* period line: a compact row under the header on tablet/desktop, a short list at the end on phone */
.periodline{display:flex;flex-direction:column;gap:0}
.periodline dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
.periodline dt,.periodline dd{margin:0;min-height:var(--row-min);display:flex;align-items:center;border-bottom:var(--dash)}
.periodline dt{font:var(--f-meta);color:var(--n600)}
.periodline dd{font:var(--f-amount);justify-content:flex-end}
.periodline .edit{padding-top:var(--sp-2)}
@media (min-width:640px){
  .periodline{flex-direction:row;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-5);padding-bottom:var(--sp-3);border-bottom:var(--hair)}
  .periodline .sec{display:none}
  .periodline dl{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5)}
  .periodline dl>div{display:flex;gap:var(--sp-2);align-items:baseline}
  .periodline dt,.periodline dd{min-height:0;border:0}
  .periodline .edit{padding:0;margin-left:auto}
}
.periodline dl>div{display:contents}
@media (min-width:640px){.periodline dl>div{display:flex}}

/* field table (budget setup) */
.fields{width:100%;border:var(--hair)}
.fields td{border:var(--hair);height:var(--row-min);padding:0 var(--sp-2)}

/* tables: micro headers, text fills, numbers right in fixed columns */
.tbl{width:100%;table-layout:auto}
.tbl th{background:var(--ink);color:var(--on-ink);height:var(--band);font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase;padding:0 var(--sp-2);text-align:left;white-space:nowrap}
.tbl thead th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}.tbl thead th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.tbl td{height:var(--row-min);border-bottom:var(--dash);padding:var(--row-pad) var(--sp-2);vertical-align:baseline;font:var(--f-body)}
.tbl td:first-child,.tbl th:first-child{padding-left:0}
.tbl td:last-child,.tbl th:last-child{padding-right:0}
.tbl th:first-child{padding-left:var(--sp-2)}
.tbl th:last-child{padding-right:var(--sp-2)}
.tbl td.r,.tbl td.n{font:var(--f-amount);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;width:1%}
.tbl th.r{text-align:right;width:1%}
.tbl tfoot td{border-top:var(--hair);border-bottom:var(--rule-top);font:var(--f-body-strong)}
.tbl tfoot td.r{font:var(--f-amount);font-weight:600}
.tbl td.name{overflow-wrap:anywhere}
.tbl tr.other td{color:var(--n600)}
.tablewrap{overflow-x:auto}

/* two-line rows: name + amount on one baseline, meta + status below (used where columns are narrow) */
.rows{display:flex;flex-direction:column}
.rowx{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--sp-3);row-gap:2px;padding:var(--row-pad) 0;min-height:var(--row-min);border-bottom:var(--dash);align-items:baseline}
.rowx .nm{font:var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rowx .v{font:var(--f-amount);text-align:right;white-space:nowrap}
.rowx .sub{font:var(--f-meta);color:var(--n600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rowx .st{justify-self:end;align-self:center}
.rowx.total{border-top:var(--hair);border-bottom:var(--rule-top)}
.rowx.total .nm{font:var(--f-body-strong)}
.rowx.total .v{font-weight:600}
.rowx.other .nm{color:var(--n600)}

.pill{display:inline-block;font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase;padding:2px var(--sp-2);border:1px solid var(--ink);border-radius:var(--r-full);white-space:nowrap;transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast)}
.pill.over,.pill.behind{background:var(--danger);border-color:var(--danger);color:var(--on-ink)}
.pill.near{background:var(--warning);border-color:var(--warning);color:var(--on-fill)}
.pill.done{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
.pill.none{border-color:var(--n400);color:var(--n600)}
.pill.carry{background:var(--warning-bg);border-color:var(--warning);color:var(--warning-text)}

/* status overview */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:var(--hair)}
.stats>div{padding:var(--sp-3) var(--sp-3) var(--sp-3) 0;display:flex;flex-direction:column;gap:var(--sp-2);align-items:flex-start;border-bottom:var(--dash);min-width:0}
.stats>div:nth-child(even){padding-left:var(--sp-3);border-left:var(--dash)}
.stats>div:nth-last-child(-n+2){border-bottom:0}
@media (min-width:1280px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats>div{border-bottom:0}.stats>div+div{padding-left:var(--sp-3);border-left:var(--dash)}}
.mix{display:flex;gap:2px;height:16px;width:100%;border-radius:var(--r-full);overflow:hidden;background:var(--track)}
.mix span{display:block;height:100%;transition:width var(--t-slow) var(--e-enter)}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr) auto 4.5em;gap:var(--sp-2) var(--sp-2);align-items:baseline;font:var(--f-body)}
.legend .num{text-align:right}
.sw{width:12px;height:12px;display:inline-block;align-self:center}

/* hero + ring + today */
.left{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);text-align:center;padding:var(--sp-2) 0 0}
.big .cur{font:var(--f-stat);margin-right:var(--sp-2);vertical-align:baseline}
.big.neg{color:var(--danger-text)}
.a-left .statusband{margin-top:auto}
.statusband{width:100%;height:var(--band);display:flex;align-items:center;justify-content:center;border-radius:var(--r-md);font:var(--f-micro);letter-spacing:.16em;text-transform:uppercase;transition:background var(--t-fast),color var(--t-fast)}
.statusband.ok{background:var(--success-bg);color:var(--success-text)}
.statusband.bad{background:var(--danger-bg);color:var(--danger-text)}
.ringrow{display:flex;align-items:center;gap:var(--sp-4);flex:1}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{display:block;width:100%;height:100%}
.ring .arc{transition:stroke-dasharray var(--t-slow) var(--e-enter),stroke var(--t-fast)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kv{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.today{display:flex;flex-direction:column;gap:var(--sp-2);flex:1;justify-content:flex-start;padding-top:var(--sp-2)}

/* progress: one line per type on phone/tablet, stacked on narrow desktop columns */
.pg-used{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3)}
.pg{display:grid;grid-template-columns:4.5em 3.2em minmax(0,1fr) auto;grid-template-areas:"l p b c";column-gap:var(--sp-2);align-items:center;min-height:var(--row-min);border-bottom:var(--dash)}
.pg .l{grid-area:l;font:var(--f-body-strong)}
.pg .p{grid-area:p;font:var(--f-amount);text-align:right}
.pg .b{grid-area:b}
.pg .c{grid-area:c;font:var(--f-amount);text-align:right;white-space:nowrap}
@media (max-width:639px){.pg{min-height:36px}.a-left .help{display:none}.banner{flex-wrap:nowrap;padding:var(--sp-1) var(--sp-3)}.banner .btn{min-height:36px;white-space:nowrap}}
@media (min-width:1024px){
  .pg{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l p" "b b" "c c";row-gap:var(--sp-1);padding:var(--sp-2) 0}
  .pg .c{font:var(--f-meta);font-family:var(--mono);color:var(--n600);text-align:left}
}
.bar{height:12px;position:relative;background:transparent}
.bar i,.minibar i{display:block;height:100%;border-radius:var(--r-full);background:var(--ink);transition:width var(--t-slow) var(--e-enter),background var(--t-fast)}
.bar i.done,.minibar i.done{background:var(--accent)}
.bar i.over{background:var(--danger)}
.minibar{height:8px;background:var(--track);width:100%;min-width:40px;border-radius:var(--r-full);overflow:hidden}

/* daily grid */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:var(--hair)}
.daygrid{width:100%}
.daygrid th,.daygrid td{min-width:var(--day);height:36px;text-align:center;padding:0}
.daygrid .wk{border-left:var(--dash)}
.daygrid .band{background:var(--ink);color:var(--on-ink);height:var(--band);font:var(--f-micro);letter-spacing:var(--tr-micro)}
.daygrid .band.wk{border-left:2px solid var(--paper)}
.daygrid .band:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.daygrid .band:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.daygrid .dname{font:var(--f-meta);color:var(--n600)}
.datebtn{border:0;border-radius:var(--r-sm);background:transparent;cursor:pointer;width:100%;height:100%;min-height:36px;font:var(--f-amount-s);padding:0;transition:background var(--t-fast),color var(--t-fast)}
.datebtn:hover{background:var(--ink);color:var(--on-ink)}
.datebtn.today{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.barcell{vertical-align:bottom;padding-top:var(--sp-2)!important}
.plot{position:relative;height:80px;display:flex;align-items:flex-end;justify-content:center}
.plot .b{width:18px;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--ink);transition:height var(--t-slow) var(--e-enter),background var(--t-fast)}
.plot .b.over{background:var(--danger)}
.plot .bl{position:absolute;left:0;right:0;border-top:1px dashed var(--n500)}
.barlbl{display:block;height:18px;line-height:18px;font:var(--f-amount-s);white-space:nowrap}
.cb{display:inline-block;width:var(--cb);height:var(--cb);border:1.5px solid var(--ink);border-radius:4px;vertical-align:middle;position:relative}
.cb.on{background:var(--ink)}
.cb.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb.fut{border-color:var(--n300);border-style:dashed}
.cb.pop{animation:pop var(--t-base) var(--e-enter) both}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

/* goals */
.goal{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:var(--sp-2) var(--sp-3);padding:var(--sp-3) 0;border-bottom:var(--dash);align-items:start}
.goal .gmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);background:var(--panel);border-radius:var(--r-md)}
.goal .gmeta.one{grid-template-columns:minmax(0,1fr)}
.goal .gmeta>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.goal .gmeta b{font:var(--f-amount);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gmeta small{font:var(--f-meta);color:var(--n600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gcat{font:var(--f-meta);color:var(--n600)}
.gcarry{display:flex;gap:var(--sp-2);align-items:flex-start;font:var(--f-meta);color:var(--warning-text);background:var(--warning-bg);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3)}
.gcarry svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gcarry b{font-weight:600}
/* achieved goals */
.ach-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--panel);border-radius:var(--r-md);padding:0 var(--sp-3)}
.ach-sum>div{padding:var(--sp-3) var(--sp-2) var(--sp-3) 0;display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.ach-sum>div+div{border-left:var(--dash);padding-left:var(--sp-3)}
.ach-sum .stat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach .gcat{font:var(--f-meta);color:var(--n600)}
.ach{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--sp-2) var(--sp-3);padding:var(--sp-4) 0;border-bottom:var(--dash);align-items:start}
.ach .medal{width:40px;height:40px;border-radius:var(--r-full);background:var(--accent);color:var(--on-fill);display:grid;place-items:center}
.ach .medal svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ach .abody{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.ach .awhen{font:var(--f-meta);color:var(--n600)}
.ach .awhen b{color:var(--ink);font-weight:600}
.ach .ameta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);background:var(--panel);border-radius:var(--r-md)}
.ach .ameta>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ach .ameta b{font:var(--f-amount);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:639px){.ach{grid-template-columns:40px minmax(0,1fr)}.ach .gact{grid-column:2}.ach-sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ach-sum>div:first-child{grid-column:1/-1;border-bottom:var(--dash)}.ach-sum>div:nth-child(2){border-left:0;padding-left:0}}
/* quick tutorial */
.tour{display:flex;flex-direction:column;gap:var(--sp-4)}
.tour-step{display:flex;flex-direction:column;gap:var(--sp-3);animation:tourIn var(--t-slow) var(--e-out)}
@keyframes tourIn{from{opacity:0;transform:translateX(var(--tx,16px))}}
.tour-ico{width:56px;height:56px;border-radius:var(--r-lg);background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.tour-ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tour-step h3{font:var(--f-title);margin:0}
.tour-step p{margin:0;color:var(--n800)}
.tour-step ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:var(--sp-1);color:var(--n800)}
.tour-dots{display:flex;gap:6px;align-items:center}
.tour-dots button{width:8px;height:8px;padding:0;border:0;border-radius:var(--r-full);background:var(--n300);cursor:pointer;transition:width var(--t-base) var(--e-move),background var(--t-base)}
.tour-dots button[aria-current="step"]{width:24px;background:var(--ink)}
.tour-nav{display:flex;gap:var(--sp-2);align-items:center}
.tour-nav .sp{flex:1}
.prio-tag{display:inline-flex;align-items:center;gap:var(--sp-1);font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase;padding:2px var(--sp-2);border-radius:var(--r-full);white-space:nowrap}
.prio-tag::before{content:"";width:6px;height:6px;border-radius:var(--r-full);background:currentColor}
.prio-tag.l1{background:var(--ink);color:var(--on-ink)}
.prio-tag.l2{border:1px solid var(--ink);color:var(--ink)}
.prio-tag.l3{border:1px dashed var(--n500);color:var(--n600)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:var(--r-full);margin-right:var(--sp-1);vertical-align:middle;background:currentColor}
.pdot.l2{background:transparent;border:1.5px solid currentColor}
.pdot.l3{background:transparent;border:1.5px dashed currentColor}
.prio-seg{background:var(--raised);border:1px solid var(--n300)}
.prio-seg button{flex:1 1 0;min-width:96px}
.prio-names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);margin-top:var(--sp-1)}
@media (max-width:480px){.prio-names{grid-template-columns:minmax(0,1fr)}}
@media (max-width:639px){.goal{grid-template-columns:24px minmax(0,1fr)}.goal .gact{grid-column:2;justify-content:flex-start}}
.goal .gbar{display:flex;align-items:center;gap:var(--sp-2)}
.goal .gbar .minibar{height:8px}
.goal .gbar .micro{white-space:nowrap}
.goal .gact{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.goal .prio{font:var(--f-amount);font-weight:600}
.goal.mini{grid-template-columns:minmax(0,1fr) auto;padding:var(--sp-2) 0;min-height:var(--row-min)}
.gname{background:none;border:0;padding:0;font:var(--f-body-strong);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--n400);text-underline-offset:4px;overflow-wrap:anywhere;min-height:24px;transition:text-decoration-color var(--t-fast)}
.gname:hover{text-decoration-color:var(--ink)}
.need{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--panel);border-radius:var(--r-md);padding:0 var(--sp-3)}
.need>div{padding:var(--sp-3) var(--sp-3) var(--sp-3) 0;display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.need>div+div{border-left:var(--dash);padding-left:var(--sp-3)}
.goalsgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap-section) var(--gap-col);grid-template-areas:"side" "list";align-items:start}
.goalsgrid .g-list{grid-area:list}.goalsgrid .g-side{grid-area:side}
@media (min-width:1024px){.goalsgrid{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-areas:"list list list list list list list list side side side side"}.goalsgrid .g-side{position:sticky;top:var(--sp-4)}}
.formpanel{background:var(--panel);border-radius:var(--r-lg);padding:var(--sp-4);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.formpanel .full{grid-column:1/-1}
@media (max-width:639px){.formpanel{grid-template-columns:minmax(0,1fr)}}

/* goal detail */
.gdetail{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap-section) var(--gap-col);align-items:start}
@media (min-width:1024px){.gdetail{grid-template-columns:repeat(12,minmax(0,1fr))}.gdetail>:first-child{grid-column:span 4}.gdetail>:last-child{grid-column:span 8}}
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3)}
.ghead h2{font:var(--f-title);margin:0;overflow-wrap:anywhere}
.gstats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:var(--hair);border-bottom:var(--hair)}
.gstats>div{padding:var(--sp-3) var(--sp-3) var(--sp-3) 0;display:flex;flex-direction:column;gap:var(--sp-1);border-bottom:var(--dash);min-width:0}
.gstats>div:nth-child(even){border-left:var(--dash);padding-left:var(--sp-3)}
.gstats>div:nth-last-child(-n+2){border-bottom:0}
.gstats .v{font:var(--f-stat);overflow-wrap:anywhere}
.gstats small{font:var(--f-meta);color:var(--n600)}
.glegend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);font:var(--f-meta);color:var(--ink)}
.glegend span{display:inline-flex;align-items:center;gap:var(--sp-2)}
.glegend i{display:inline-block;width:24px;height:0;border-top:2px solid var(--ink)}
.glegend i.plan{border-top:2px dashed var(--n500)}
.gchart{position:relative;width:100%}
.gchart svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.gchart .ax{font:var(--f-micro);letter-spacing:var(--tr-micro);fill:var(--n600)}
.gchart .axn{font:var(--f-amount-s);fill:var(--n600)}
.gchart .lbl{font:var(--f-micro);letter-spacing:var(--tr-micro)}
.gchart .actual{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw var(--t-slow) var(--e-enter) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.ctip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--on-ink);padding:var(--sp-2) var(--sp-3);font:var(--f-meta);white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity var(--t-fast)}
.ctip.show{opacity:1}
.ctip b{display:block;font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase;margin-bottom:2px}
.ctip span{display:flex;justify-content:space-between;gap:var(--sp-4)}
.ctip strong{font:var(--f-amount-s)}

/* forms */
.input,.select{height:44px;border:1px solid var(--n500);background:var(--raised);padding:0 var(--sp-3);width:100%;min-width:0;border-radius:var(--r-md);font:var(--f-control);transition:border-color var(--t-fast)}
.input:hover,.select:hover{border-color:var(--ink)}
.input.r{text-align:right;font-family:var(--mono);font-weight:500}
.field{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.field>span{font:var(--f-micro);letter-spacing:var(--tr-micro);text-transform:uppercase}
.field small{font:var(--f-meta);color:var(--n600)}
.errmsg{font:var(--f-meta);color:var(--danger-text);animation:fadeUp var(--t-fast) var(--e-enter) both}

/* quick add */
.qa{display:flex;flex-direction:column;gap:var(--sp-3)}
@media (max-width:639px){.qa{gap:var(--sp-2)}.qa .qa-amt input{font-size:26px;line-height:32px}.qa .chipbtn{min-height:36px;padding:0 var(--sp-3)}.qa .select{height:40px}.qa-actions .btn.primary{min-height:44px}.qa .field>span{font-size:10px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qsel{flex:1 1 160px;min-width:0}

/* category badge: tinted square with the line icon */

function monthKeyFor(date, startDay) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  if (d.getDate() < startDay) d.setMonth(d.getMonth() - 1, 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1);
}
function periodDays(mk, startDay) {
  const [y, m] = mk.split("-").map(Number);
  const start = new Date(y, m - 1, startDay);
  const end = startDay === 1 ? new Date(y, m, 0) : new Date(y, m, startDay - 1);
  const out = [];
  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) out.push(iso(d));
  return out;
}

/* ================= storage: private cloud doc per account + a local cache on each device ================= */
// "db": the viewer's private storage in their Claude account, which every device signed in to it reads, with a
// copy of each doc cached in this browser so the app opens and keeps working when the cloud is out of reach.
// "local": no account storage in this view, so this browser is the only copy.
const store = {
  kind: "none", db: null, uid: null, cache: false,
  async init() {
    try { localStorage.setItem("bb:probe", "1"); localStorage.removeItem("bb:probe"); this.cache = true; } catch (e) { this.cache = false; }
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) { this.kind = "db"; this.db = db; this.uid = id; return; }
      }
    } catch (e) { /* fall through */ }
    this.kind = this.cache ? "local" : "none";
  },
  path(key) { return "data/users/" + this.uid + "/" + key; },
  // cache keys are per account, so two people sharing a browser never read each other's copy
  ck(key) { return this.kind === "db" ? "bb:" + this.uid + ":" + key : "bb:" + key; },
  readCache(key) { if (!this.cache) return null; try { const v = localStorage.getItem(this.ck(key)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  writeCache(key, val) { if (!this.cache) return; try { localStorage.setItem(this.ck(key), JSON.stringify(val)); } catch (e) { /* the cache is best effort */ } },
  // The cloud wins when it answers; the cached copy covers the times it does not.
  async get(key) {
    if (this.kind === "db") {
      try { const s = await this.db.doc(this.path(key)).get(); const v = s.exists ? clone(s.data()) : null; if (v) this.writeCache(key, v); return v; }
      catch (e) { return this.readCache(key); }
    }
    return this.kind === "local" ? this.readCache(key) : null;
  },
  async cloudSet(key, val) {
    try { return await this.db.doc(this.path(key)).set(val); }

      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); return this.db.doc(this.path(key)).set(val); }

    }

  async set(key, val) {
    if (this.kind === "local") { localStorage.setItem("bb:" + key, JSON.stringify(val)); return; }
    if (this.kind === "db") { this.writeCache(key, val); return this.cloudSet(key, val); }
  },
  async keys() {
    if (this.kind === "db") { const snap = await this.db.collection("data/users/" + this.uid).get(); return snap.docs.map(x => x.id); }

    return [];
  },
  async del(key) {
    if (this.cache) { try { localStorage.removeItem(this.ck(key)); } catch (e) { /* ignore */ } }

/* ================= saving ================= */
const pending = new Map();
let saveTimer = null;
function setSaveErr(t) { const el = document.getElementById("saveState"); el.textContent = t || ""; el.title = t || ""; }
function periodTotalsOf(m) {
  const t = { needs: 0, sav: {} };
  m.txns.forEach(x => { if (x.type === "needs") t.needs += x.amount; if (x.type === "savings") t.sav[x.cat] = (t.sav[x.cat] || 0) + x.amount; });

}
// A month save also refreshes that month's totals in settings, which Goals read across all periods.
function saveMonthObj(mk, m) {

  d.settings.periodTotals[mk] = periodTotalsOf(m);

function save(what) {
  if (S.sample) return;

  if (what === "month" || what === "both") { saveMonthObj(d.monthKey, d.month); return; }

function schedule() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
async function flush() {
  clearTimeout(saveTimer);

    for (const [k, v] of items) await store.set(k, v);
    if (store.kind === "db") await markSynced();
    setSaveErr("");
  } catch (e) {
    for (const [k, v] of items) if (!pending.has(k)) pending.set(k, v);

    setSaveErr(e && e.code === "quota_exceeded" ? T("Penyimpanan penuh", "Storage is full") : store.kind === "db" ? T("Belum sinkron", "Not synced") : T("Gagal menyimpan", "Save failed"));

/* sync: every cloud write stamps a "sync" doc; other devices compare it to the last stamp they saw */
async function markSynced() {
  const meta = { savedAt: new Date().toISOString(), device: deviceId() };
  await store.cloudSet("sync", meta);
  store.writeCache("sync", meta);
  S.syncSeen = meta.savedAt;
  return meta;
}
// Simpan: write what is on screen to this device's cache and to the account's cloud copy.
async function syncSave() {
  const d = D();
  saveMonthObj(d.monthKey, d.month);   // queues the open month and settings
  await flush();
  if (pending.size) throw new Error("save");
  const txns = d.month.txns.length;
  if (store.kind !== "db") return { cloud: false, txns };
  const meta = store.readCache("sync") || {};

}

async function syncLoad() {
  await flush();

  if (!s || !s.cats) return null;
  const meta = await store.get("sync");

  try { for (const k of await store.keys()) if (k.startsWith("m-")) { if (await store.get(k)) months++; } } catch (e) { /* the open month is still read below */ }
  const d = D(), mk = d ? d.monthKey : null;

  S.view = "app"; S.forms = {}; S.goalForm = null;
  await openMonth(mk || monthKeyFor(new Date(), s.startDay));
  if (meta) S.syncSeen = meta.savedAt;
  return { months, meta };
}

function compute() {

  const byType = { income: 0, needs: 0, wants: 0, savings: 0, debt: 0 };
  const byCat = {}, other = {};
  TYPES.forEach(t => { byCat[t.k] = {}; other[t.k] = 0; s.cats[t.k].forEach(c => byCat[t.k][c.id] = 0); });
  const byDay = Object.fromEntries(days.map(x => [x, { spend: 0, wants: 0, any: false }]));
  for (const t of m.txns) {
    byType[t.type] += t.amount;
    if (t.cat in byCat[t.type]) byCat[t.type][t.cat] += t.amount; else other[t.type] += t.amount;
    if (daySet.has(t.date)) {
      const b = byDay[t.date]; b.any = true;
      if (t.type === "needs" || t.type === "wants") b.spend += t.amount;
      if (t.type === "wants") b.wants += t.amount;

  const expected = {};
  TYPES.forEach(t => expected[t.k] = s.cats[t.k].filter(c => !c.archived).reduce((a, c) => a + (c.expected || 0), 0));
  const dailyBudget = days.length ? (budgets.needs + budgets.wants) / days.length : 0;
  const elapsed = days.filter(x => x <= today);
  const leftover = base + byType.income - byType.needs - byType.wants - byType.savings - byType.debt;
  const leftoverExpected = base + m.incomeGoal - budgets.needs - budgets.wants - budgets.savings - expected.debt;
  return { days, today, byType, byCat, other, byDay, budgets, expected, debtExpected: expected.debt, dailyBudget, elapsed, leftover, leftoverExpected };
}

// Goal state as of the viewed period: only deposits from the goal's first period up to that period count.
// A goal still short of its target once the deadline passes carries over in blocks of `carry` months

// across years if need be. Blocks are anchored to the original deadline, so the due month never drifts.
function goalCalc(g, totals, active) {
  let collected = g.startAmount, reachedAt = collected >= g.target ? g.createdMonth : null;
  for (let mk = g.createdMonth; mk <= active; mk = shiftMonth(mk, 1)) {
    collected += ((totals[mk] || {}).sav || {})[g.catId] || 0;
    if (!reachedAt && collected >= g.target) reachedAt = mk;
  }
  const remaining = Math.max(0, g.target - collected);
  const carried = remaining && active > g.deadline ? monthDiff(g.deadline, active) : 0;
  const due = carried ? shiftMonth(g.deadline, Math.ceil(carried / carryLen(g)) * carryLen(g)) : g.deadline;
  const left = Math.max(1, monthDiff(active, due) + 1);
  const perPeriod = remaining ? Math.ceil(remaining / left / 1000) * 1000 : 0;
  const total = Math.max(1, monthDiff(g.createdMonth, g.deadline) + 1);
  const elapsed = Math.min(total, Math.max(0, monthDiff(g.createdMonth, active) + 1));
  const planned = g.startAmount + (g.target - g.startAmount) * elapsed / total;
  const status = collected >= g.target ? "reached" : carried ? "carried" : collected >= planned ? "ontrack" : "behind";
  const keys = [0, 1, 2].map(i => shiftMonth(active, -i)).filter(k => k >= g.createdMonth);
  const avg = keys.length ? keys.reduce((a, k) => a + (((totals[k] || {}).sav || {})[g.catId] || 0), 0) / keys.length : 0;

  else {

    const late = monthDiff(g.deadline, est);
    estimate = T("Estimasi ", "Estimated ") + fmtMonth(est) + (late > 0 ? ", " + late + T(" bulan setelah tenggat", " months after the deadline") : late < 0 ? ", " + (-late) + T(" bulan lebih cepat", " months early") : T(", tepat tenggat", ", right on the deadline"));
    estLabel = fmtMonth(est);

  }
  return { collected, remaining, left, perPeriod, planned, status, estimate, estLabel, estSub, due, carried, reachedAt, pct: pctOf(collected, g.target) };

  const active = rows.filter(r => r.k.status !== "reached").sort((a, b) => goalLevel(a.g) - goalLevel(b.g) || a.i - b.i);
  const need = active.reduce((a, r) => a + r.k.perPeriod, 0);

function grow(key, pct, dim = "width") {

function postRender(root) {

    const from = animOK && prevV.has(key) ? prevV.get(key) : to;
    prevV.set(key, to);
    if (from === to || RM.matches) { el.textContent = FMT[f](to); return; }

  };

  return `<div class="dash">${periodBlock}${leftBlock}${ringBlock}${todayBlock}${progBlock}${goalsBlock}${grid}${statusBlock}${cashBlock}${topBlock}${debtBlock}${ledger("needs", "needs", T("Ringkasan Needs", "Needs Summary"), c.budgets.needs, "spend")}${ledger("wants", "wants", T("Ringkasan Wants", "Wants Summary"), c.budgets.wants, "spend")}${ledger("savings", "savings", T("Ringkasan Savings", "Savings Summary"), c.budgets.savings, "goal")}${ledger("income", "income", T("Ringkasan Income", "Income Summary"), m.incomeGoal, "goal")}</div>`;
}

function catLook(type, id) {
  const cat = (D().settings.cats[type] || []).find(c => c.id === id) || {};
  const d = CAT_DEFAULTS[id] || TYPE_DEFAULTS[type] || ["dots", 8];
  return { icon: CAT_ICONS[cat.icon] ? cat.icon : d[0], color: cat.color >= 1 && cat.color <= 8 ? cat.color : d[1] };

const badge = (icon, color, cls = "") => `<span class="cbadge ${cls}" style="--c:var(--cat-${color})" aria-hidden="true"><svg viewBox="0 0 16 16">${CAT_ICONS[icon] || CAT_ICONS.dots}</svg></span>`;
const catBadge = (type, id, cls) => { const l = catLook(type, id); return badge(l.icon, l.color, cls); };

function frequentCats(n = 4) {
  const counts = {};
  D().month.txns.forEach(t => { const k = t.type + ":" + t.cat; counts[k] = (counts[k] || 0) + 1; });
  const live = new Set(TYPES.flatMap(t => liveCats(t.k).map(x => t.k + ":" + x.id)));
  const ranked = Object.keys(counts).filter(k => live.has(k)).sort((a, b) => counts[b] - counts[a]);
  ["needs", "wants"].forEach(t => liveCats(t).forEach(x => { const k = t + ":" + x.id; if (!ranked.includes(k)) ranked.push(k); }));
  return ranked.slice(0, n).map(k => { const [type, id] = k.split(":"); return { type, id }; });
}

  else {

function afterUndo(mk, mref) {
  if (S.sample) { if (D().monthKey === mk) render(); return; }
  if (D().monthKey === mk) { save("month"); render(); }
  else saveMonthObj(mk, mref);
}
function deleteTxn(id) {
  const d = D(), i = d.month.txns.findIndex(x => x.id === id);
  if (i < 0) return;
  const item = d.month.txns[i], mref = d.month, mk = d.monthKey;
  const commit = () => {
    const j = mref.txns.findIndex(x => x.id === id);
    if (j >= 0) mref.txns.splice(j, 1);
    if (S.forms.inline && S.forms.inline.id === id) S.forms.inline = null;
    save("month"); render();
  };
  const row = document.querySelector(`.txrow[data-id="${CSS.escape(id)}"]`);
  if (row && !RM.matches) {
    row.style.height = row.offsetHeight + "px"; void row.offsetHeight;
    row.classList.add("leaving"); row.style.height = "0px";
    setTimeout(commit, 220);
  } else commit();
  showToast(T("Transaksi dihapus", "Transaction deleted"), () => {
    mref.txns.splice(Math.min(i, mref.txns.length), 0, item);
    S.lastAdded = item.id;
    afterUndo(mk, mref);
  });
}

  };

let chart = null; // geometry + rows of the goal chart on screen, read by the hover layer
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p;
  return 10 * p;
}
function goalPeriods(g, totals, active) {
  const end = active > g.deadline ? active : g.deadline;
  const n = Math.max(1, monthDiff(g.createdMonth, end) + 1), planN = Math.max(1, monthDiff(g.createdMonth, g.deadline) + 1);
  const rows = [];
  let cum = g.startAmount;
  for (let i = 0; i < n; i++) {
    const mk = shiftMonth(g.createdMonth, i), past = mk <= active;
    const dep = ((totals[mk] || {}).sav || {})[g.catId] || 0;
    if (past) cum += dep;
    rows.push({ mk, dep: past ? dep : null, cum: past ? cum : null, plan: g.startAmount + (g.target - g.startAmount) * Math.min(i + 1, planN) / planN });
  }
  return rows;
}
function goalChartSVG(g, rows) {
  // A narrower drawing on phones keeps 11px labels near 10px once scaled to the column.
  const narrow = !DESK.matches;
  const W = narrow ? 380 : 640, H = narrow ? 250 : 270, L = 44, R = narrow ? 76 : 96, T = 16, B = 32, pw = W - L - R, ph = H - T - B, n = rows.length;
  const vmax = Math.max(g.target, ...rows.map(r => r.cum || 0));
  const step = niceStep(vmax / 4), ymax = Math.ceil(vmax / step) * step;
  const X = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1)), Y = v => T + ph - v / ymax * ph;
  const ticks = []; for (let v = 0; v <= ymax + 1; v += step) ticks.push(v);
  const every = Math.ceil(n / (narrow ? 4 : 7));
  const xl = rows.map((r, i) => {
    const show = i % every === 0 || (i === n - 1 && (n - 1) % every >= Math.ceil(every / 2));
    if (!show) return "";
    const m = Number(r.mk.slice(5)) - 1;
    return `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" class="ax">${MS()[m]}${i === 0 || m === 0 ? " " + r.mk.slice(2, 4) : ""}</text>`;
  }).join("");
  const plan = rows.map((r, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(r.plan).toFixed(1)}`).join("");
  const act = rows.filter(r => r.cum != null);
  const actPath = act.map((r, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(r.cum).toFixed(1)}`).join("");
  let len = 0; for (let i = 1; i < act.length; i++) len += Math.hypot(X(i) - X(i - 1), Y(act[i].cum) - Y(act[i - 1].cum));
  const li = act.length - 1, lx = li >= 0 ? X(li) : 0, ly = li >= 0 ? Y(act[li].cum) : 0;
  const planEndY = Y(rows[n - 1].plan);
  const actLblRight = lx < L + pw - 70;
  const actLblY = Math.abs(ly - planEndY) < 18 && !actLblRight ? ly + 18 : ly - 10;
  chart = { W, L, pw, n, X, Y, rows };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T("Terkumpul dibanding rencana per periode untuk", "Saved vs plan per period for")} ${esc(g.name)}">
    ${ticks.map(v => `<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? "var(--n300)" : "var(--ink)"}" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="axn">${short(v)}</text>`).join("")}
    ${xl}
    <path d="${plan}" fill="none" stroke="var(--n500)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${L + pw + 8}" y="${planEndY + 4}" class="lbl" fill="var(--n600)">Target ${short(g.target)}</text>
    ${act.length > 1 ? `<path class="actual" style="--len:${Math.ceil(len)}" d="${actPath}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>` : ""}
    ${li >= 0 ? `<circle cx="${lx}" cy="${ly}" r="5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>
    <text x="${actLblRight ? lx + 10 : lx - 10}" y="${actLblY}" text-anchor="${actLblRight ? "start" : "end"}" class="lbl" fill="var(--ink)">${T("Terkumpul", "Saved")} ${short(act[li].cum)}</text>` : ""}
    <g class="hov" visibility="hidden"><line class="hx" y1="${T}" y2="${T + ph}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3"/><circle class="hp" r="4" fill="var(--paper)" stroke="var(--n500)" stroke-width="2"/><circle class="ha" r="4" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/></g>
    <rect class="hit" x="${L - 12}" y="${T}" width="${pw + 24}" height="${ph}" fill="transparent"/>
  </svg>`;
}
function attachChartHover(root) {
  const wrap = root.querySelector(".gchart");
  if (!wrap || !chart) return;
  const svg = wrap.querySelector("svg"), hit = svg.querySelector(".hit"), hov = svg.querySelector(".hov"), tip = wrap.querySelector(".ctip");
  const show = e => {
    const box = svg.getBoundingClientRect(), sx = (e.clientX - box.left) * chart.W / box.width;
    const i = Math.max(0, Math.min(chart.n - 1, Math.round(chart.n === 1 ? 0 : (sx - chart.L) / chart.pw * (chart.n - 1))));
    const r = chart.rows[i], x = chart.X(i);
    hov.setAttribute("visibility", "visible");
    hov.querySelector(".hx").setAttribute("x1", x); hov.querySelector(".hx").setAttribute("x2", x);
    const hp = hov.querySelector(".hp"), ha = hov.querySelector(".ha");
    hp.setAttribute("cx", x); hp.setAttribute("cy", chart.Y(r.plan));
    if (r.cum != null) { ha.setAttribute("visibility", "visible"); ha.setAttribute("cx", x); ha.setAttribute("cy", chart.Y(r.cum)); } else ha.setAttribute("visibility", "hidden");
    tip.innerHTML = `<b>${fmtMonth(r.mk)}</b>${r.cum != null ? `<span>${T("Terkumpul", "Saved")} <strong>${rp(r.cum)}</strong></span><span>${T("Setoran", "Deposit")} <strong>${rp(r.dep)}</strong></span>` : `<span>${T("Belum berjalan", "Not started")}</span>`}<span>${T("Rencana", "Plan")} <strong>${rp(r.plan)}</strong></span>`;
    const px = x / chart.W * box.width, half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(box.width - half, px)) + "px";
    tip.classList.add("show");
  };
  const hide = () => { hov.setAttribute("visibility", "hidden"); tip.classList.remove("show"); };
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}

function moveGoal(id, dir) {
  const c = compute(), gs = goalsSummary(c), act = gs.active.map(r => r.g);
  const i = act.findIndex(g => g.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= act.length || goalLevel(act[i]) !== goalLevel(act[j])) return;
  [act[i], act[j]] = [act[j], act[i]];
  D().settings.goals = act.concat(gs.reached.map(r => r.g));
  save("settings"); render();

/* swipe: rows left = delete (touch), header horizontal = change month */
(() => {
  let row = null, x0 = 0, y0 = 0, dx = 0, locked = null;
  document.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch") return;
    const inner = e.target.closest(".txinner");
    row = inner; x0 = e.clientX; y0 = e.clientY; dx = 0; locked = null;
  }, { passive: true });
  document.addEventListener("pointermove", e => {
    if (!row || e.pointerType !== "touch") return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (locked == null && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) locked = Math.abs(ddx) > Math.abs(ddy) ? "x" : "y";
    if (locked !== "x") return;
    dx = Math.min(0, ddx); row.style.transition = "none"; row.style.transform = `translateX(${dx}px)`;
    if (row.parentElement) row.parentElement.classList.add("swiping");
  }, { passive: true });
  const end = () => {
    if (!row) return;
    const r = row; row = null; r.style.transition = "";
    if (locked === "x") { r.dataset.swiped = "1"; setTimeout(() => delete r.dataset.swiped, 400); }
    if (dx < -90) { r.style.transform = "translateX(-100%)"; deleteTxn(r.dataset.id); }
    else { r.style.transform = ""; const p = r.parentElement; if (p) setTimeout(() => p.classList.remove("swiping"), 240); }
  };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();

/* sliders (header pages, list types): slide by finger (native scroll), mouse drag or wheel; fades mark hidden options */
function segEdges(seg) {
  const max = seg.scrollWidth - seg.clientWidth;
  seg.classList.toggle("more-l", max > 1 && seg.scrollLeft > 2);
  seg.classList.toggle("more-r", max > 1 && seg.scrollLeft < max - 2);
}
(() => {
  // Delegated, because the list slider is re-rendered with its view.
  let seg = null, x0 = null, left0 = 0, moved = false;
  document.addEventListener("scroll", e => { if (e.target.classList && e.target.classList.contains("seg")) segEdges(e.target); }, { capture: true, passive: true });
  document.addEventListener("pointerdown", e => {
    const s = e.target.closest && e.target.closest(".seg");
    if (!s || e.pointerType === "touch" || e.button !== 0) return;   // touch already scrolls natively
    seg = s; x0 = e.clientX; left0 = s.scrollLeft; moved = false;
  });
  window.addEventListener("pointermove", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0;
    if (!moved && Math.abs(dx) > 5) { moved = true; seg.classList.add("dragging"); }
    if (moved) seg.scrollLeft = left0 - dx;
  });
  window.addEventListener("pointerup", () => {
    if (x0 == null) return;
    x0 = null;
    if (moved) { const s = seg; setTimeout(() => s.classList.remove("dragging"), 0); }
  });
  document.addEventListener("click", e => { if (moved && e.target.closest && e.target.closest(".seg")) { e.stopPropagation(); e.preventDefault(); } moved = false; }, true);
  document.addEventListener("wheel", e => {
    const s = e.target.closest && e.target.closest(".seg");
    if (!s || s.scrollWidth <= s.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    s.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive: false });
})();
DESK.addEventListener("change", () => { if (overlay) closeOverlay(false, true); S.forms = {}; render(); });
PHONE.addEventListener("change", () => render());
NARROW.addEventListener("change", () => render());
window.addEventListener("pagehide", () => { flush(); });
// Coming back to the app: if another device saved since, pull its data, unless something here is mid-edit.
async function autoSync() {
  if (document.visibilityState !== "visible" || store.kind !== "db" || S.view !== "app" || S.sample || S.syncBusy) return;
  if (pending.size) { flush(); return; }   // saves that failed earlier go first; the pull waits for the next visit
  if (overlay || S.goalForm || (S.forms.inline && S.forms.inline.amount)) return;
  let meta = null;
  try { const snap = await store.db.doc(store.path("sync")).get(); meta = snap.exists ? snap.data() : null; } catch (e) { return; }
  if (!meta || meta.device === deviceId() || (S.syncSeen && meta.savedAt <= S.syncSeen)) return;
  S.syncBusy = "load"; syncUI();
  try { if (await syncLoad()) { animOK = false; render(); showToast(T("Diperbarui dari perangkat lain · ", "Updated from another device · ") + syncTime(meta.savedAt)); } }
  catch (e) { /* stay on this device's data */ }
  S.syncBusy = null; syncUI();
}
document.addEventListener("visibilitychange", autoSync);
window.addEventListener("focus", autoSync);
window.addEventListener("hashchange", () => { const h = (location.hash || "").slice(1); if (TAB_ORDER.includes(h)) setTab(h); });

/* ================= boot ================= */
async function boot() {
  loadPrefs();
  PREFERS_DARK.addEventListener("change", () => { if (!S.theme) document.querySelectorAll(".hprefs").forEach(el => el.innerHTML = prefsHTML()); });
  const h = (location.hash || "").slice(1);
  if (TAB_ORDER.includes(h)) S.tab = h;
  await store.init();
  let s = null;
  try { s = await store.get("settings"); } catch (e) { s = null; }
  if (!s || !s.cats) { S.view = "onboarding"; }
  else {
    S.data = { settings: normalizeSettings(s), monthKey: null, month: null };
    S.view = "app";
    await openMonth(monthKeyFor(new Date(), s.startDay));
    let meta = null;
    if (store.kind === "db") { try { meta = await store.get("sync"); } catch (e) { meta = null; } }
    if (meta) S.syncSeen = meta.savedAt;
  }
  render();
}
boot();
})();
</script>
